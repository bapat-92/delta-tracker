# Runs the frozen strategy backtest when you start it by hand and sends the summary to your tracker.
# Needs two repository secrets (Settings > Secrets and variables > Actions): TRACKER_URL, TRACKER_PASSPHRASE.
# If your site is behind Cloudflare Access, also add CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET (a Service Token).
name: daily-backtest
on:
  workflow_dispatch:             # manual only: Actions tab > daily-backtest > Run workflow
    inputs:
      from_date: { description: "From date YYYY-MM-DD (blank = last 30 days)", required: false, default: "" }
      to_date: { description: "To date YYYY-MM-DD (blank = same as from)", required: false, default: "" }
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pandas requests
      - name: Restore downloaded candles
        uses: actions/cache@v4
        with:
          path: .cache/candles
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      - name: Run backtest
        run: python delta-tracker/analysis/daily_job.py
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
