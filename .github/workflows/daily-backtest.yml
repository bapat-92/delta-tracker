# Runs the frozen strategy backtest when you start it by hand and sends the summary to your tracker.
# Needs two repository secrets (Settings > Secrets and variables > Actions): TRACKER_URL, TRACKER_PASSPHRASE.
# If your site is behind Cloudflare Access, also add CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET (a Service Token).
name: daily-backtest
on:
  workflow_dispatch:             # manual only: Actions tab > daily-backtest > Run workflow
    inputs:
      from_date: { description: "From date YYYY-MM-DD (blank = last 30 days)", required: false, default: "" }
      to_date: { description: "To date YYYY-MM-DD (blank = same as from)", required: false, default: "" }
      capital: { description: "Capital in USD (blank = file value, 5000)", required: false, default: "" }
      share: { description: "Margin share of capital in % (blank = 100)", required: false, default: "" }
      ratio: { description: "Bought / sold lots (blank = 0.3)", required: false, default: "" }
      spread: { description: "Half-spread in % (blank = 2)", required: false, default: "" }
      minpct: { description: "Minimum profit at spot, % of margin (blank = 3)", required: false, default: "" }
      balanced: { description: "Balanced range: type 1 to maximise the smaller side (blank = widest range)", required: false, default: "" }
      equi: { description: "Equidistant strikes: tolerance in USD, e.g. 200 (blank = off)", required: false, default: "" }
      hours: { description: "Entry hours before expiry, e.g. 9,8,7,6,5,4 (blank = file value)", required: false, default: "" }
concurrency:
  group: backtest
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pandas requests pyarrow
      - name: Get the stored monthly data files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-feed --dir .feed --pattern "*.parquet" || echo "no stored data files yet, will download from Delta"
      - name: Restore downloaded candles
        uses: actions/cache@v4
        with:
          path: .cache/candles
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      - name: Run backtest
        run: python delta-tracker/analysis/daily_job.py
        env:
          FEED_DIR: .feed
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          CAPITAL: ${{ inputs.capital }}
          SHARE: ${{ inputs.share }}
          RATIO: ${{ inputs.ratio }}
          SPREAD: ${{ inputs.spread }}
          MINPCT: ${{ inputs.minpct }}
          HOURS: ${{ inputs.hours }}
          BALANCED: ${{ inputs.balanced }}
          EQUI: ${{ inputs.equi }}
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
